version: '3'
services:
  wom-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wom-streamlit
    volumes:
      - ./logs:/app/logs:rw
      - ./chat:/app/chat:rw
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /app/run_server.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"      # Maximum size of a single log file
        max-file: "3"        # Maximum number of log files to keep (rotates after 3 files)
    deploy:
      resources:
        limits:
          memory: 8000M
    environment:
      VIRTUAL_HOST: wom-chat.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: wom-chat.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com

  wom-flask:
    build:
      context: .
      dockerfile: Dockerfile.dash
    container_name: wom-flask
    volumes:
      - ./logs:/app/logs:rw
      - ./cache:/app/cache:rw
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /app/wom/run_api_server.sh
    logging:
      driver: json-file
      options:
        max-size: "10m"      # Maximum size of a single log file
        max-file: "3"        # Maximum number of log files to keep (rotates after 3 files)
    deploy:
      resources:
        limits:
          memory: 8000M
    environment:
      VIRTUAL_HOST: wom-api.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: wom-api.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com
  growth-rate:
    build:
      context: growth_rate
      dockerfile: Dockerfile
    container_name: growth-rate
    working_dir: /app
    volumes:
      - ./growth_rate/logs:/app/logs:rw
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8000M
networks:
  nginx-net:
    external:
      name: nginx-net