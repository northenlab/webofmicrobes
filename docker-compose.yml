version: '3'
services:
  wom-streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wom-streamlit
    volumes:
      - ./logs:/app/logs:rw
      - ./chat:/app/chat:rw
      - ./pages:/app/pages:rw
    networks:
      - default
    restart: unless-stopped
    command: /app/run_server.sh
    ports:
    - "5002:5000"
    logging:
      driver: json-file
      options:
        max-size: "10m"      # Maximum size of a single log file
        max-file: "3"        # Maximum number of log files to keep (rotates after 3 files)
    deploy:
      resources:
        limits:
          memory: 8000M
    environment:
      VIRTUAL_HOST: wom-chat.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: wom-chat.gnps2.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com

  wom-mcp:
    build:
      context: .
      dockerfile: ./mcp/Dockerfile
    container_name: wom-mcp
    working_dir: /app
    networks:
      - default
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 8000M
    environment:
      MODEL_DIR: trained_models/bpr_consumed

networks:
  nginx-net:
    external:
      name: nginx-net