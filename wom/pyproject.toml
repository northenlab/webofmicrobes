[project]
name = "wom"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "torch>=2.0.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.0",
    "rapidfuzz>=2.0.0",
    "pyarrow>=6.0.0",
    "openpyxl>=3.0.0",
    "implicit>=0.7.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.0",
    "gunicorn>=20.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]
